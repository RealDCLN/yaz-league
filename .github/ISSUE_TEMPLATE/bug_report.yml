name: Bug report
description: Report a reproducible problem with the public site or admin panel.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not include secrets, passwords or private player data here.**
        Security vulnerabilities must be reported privately — see
        [SECURITY.md](https://github.com/RealDCLN/yaz-league/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Admin panel
        - Supabase / RLS
        - Deployment / Netlify
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console errors or anything else that helps.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I removed all secrets and private data from this report.
          required: true
