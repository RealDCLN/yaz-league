<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — YAZ LEAGUE</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <span class="logo-yaz">YAZ</span> <span class="logo-league">LEAGUE</span> <span class="badge-admin">Admin</span>
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="https://www.instagram.com/de.voyageur/" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="Instagram">
          <i class="fab fa-instagram"></i> Instagram
        </a>
        <button id="btn-logout" class="nav-link btn-logout hidden"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <!-- Auth Card -->
    <div id="auth-section" class="auth-container">
      <div class="auth-card">
        <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
        <p>Log in to manage check-ins, teams, and league standings.</p>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="admin@example.com" value="filipposliv99@gmail.com" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> Log In</button>
          <div id="login-error" class="error-message"></div>
        </form>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="dashboard-container hidden">
      <div class="dashboard-header">
        <h1>Dashboard</h1>
        <p>Logged in as <span id="user-email-display"></span></p>
      </div>

      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="tab-checkins"><i class="fas fa-map-marker-alt"></i> New Check-in</button>
        <button class="tab-btn" data-tab="tab-teams"><i class="fas fa-users"></i> Manage Teams</button>
        <button class="tab-btn" data-tab="tab-logs"><i class="fas fa-list"></i> Activity Log</button>
      </div>

      <!-- Tab Content: Add Checkin -->
      <div id="tab-checkins" class="tab-content active">
        <div class="card">
          <h3>Log New Check-in</h3>
          <form id="form-checkin">
            <div class="form-row">
              <div class="form-group">
                <label for="select-team">Select Team</label>
                <select id="select-team" required></select>
              </div>
              <div class="form-group">
                <label for="input-country">Country</label>
                <input type="text" id="input-country" placeholder="e.g. Greece" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="input-city">City / Location</label>
                <input type="text" id="input-city" placeholder="e.g. Heraklion" required />
              </div>
              <div class="form-group">
                <label for="input-lat">Latitude</label>
                <input type="number" step="any" id="input-lat" placeholder="35.3387" required />
              </div>
              <div class="form-group">
                <label for="input-lng">Longitude</label>
                <input type="number" step="any" id="input-lng" placeholder="25.1442" required />
              </div>
            </div>
            <div class="form-group">
              <label for="input-notes">Notes / Highlights</label>
              <textarea id="input-notes" rows="3" placeholder="Checked in at ancient port..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Save Check-in</button>
          </form>
        </div>
      </div>

      <!-- Tab Content: Teams -->
      <div id="tab-teams" class="tab-content">
        <div class="card">
          <h3>Teams Overview</h3>
          <div id="teams-list">Loading teams...</div>
        </div>
      </div>

      <!-- Tab Content: Logs -->
      <div id="tab-logs" class="tab-content">
        <div class="card">
          <h3>Recent Check-ins Log</h3>
          <div id="logs-list">Loading logs...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span class="logo-yaz">YAZ</span> <span class="logo-league">LEAGUE</span>
      </div>
      <div class="footer-links">
        <a href="https://www.instagram.com/de.voyageur/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
          <i class="fab fa-instagram"></i> Instagram
        </a>
        <a href="index.html" class="social-link"><i class="fas fa-home"></i> Main Site</a>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
