name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please keep in mind that this is a static
        site with no build step, and that private player data must stay private.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Admin panel
        - Data / Supabase
        - Deployment
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request does not require exposing private player data.
          required: true
