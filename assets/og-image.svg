<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="YAZ LEAGUE — Το απόλυτο πρωτάθλημα γεωγραφίας">
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1D2A44"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#E3B341" stroke-width="1" opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3B341" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E3B341" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- compass glow -->
  <circle cx="900" cy="315" r="260" fill="url(#glow)"/>

  <!-- compass rose -->
  <g transform="translate(900 315)" opacity="0.92">
    <circle r="180" fill="none" stroke="#E3B341" stroke-width="2" opacity="0.4"/>
    <circle r="140" fill="none" stroke="#E3B341" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>
    <path d="M0 -170 L24 0 L0 170 L-24 0 Z" fill="#E2572B" opacity="0.92"/>
    <path d="M-170 0 L0 -24 L170 0 L0 24 Z" fill="#E3B341" opacity="0.72"/>
    <circle r="10" fill="#F0E4C8"/>
  </g>

  <!-- text block -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="230" font-size="34" fill="#A9B6CC" letter-spacing="14" font-weight="600">ΣΕΖΟΝ 2026</text>
    <text x="80" y="380" font-size="132" fill="#F0E4C8" letter-spacing="8" font-weight="900">YAZ</text>
    <text x="80" y="500" font-size="132" fill="#E3B341" letter-spacing="8" font-weight="900">LEAGUE</text>
    <text x="82" y="562" font-size="26" fill="#A9B6CC" font-style="italic">«Το απόλυτο πρωτάθλημα γεωγραφίας»</text>
    <text x="82" y="600" font-size="18" fill="#7C8BA3" letter-spacing="6">ΔΙΟΡΓΑΝΩΣΗ DE.VOYAGEUR</text>
  </g>
</svg>
