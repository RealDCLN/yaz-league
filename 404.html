<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Σελίδα δεν βρέθηκε · YAZ LEAGUE</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B1117">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IBM+Plex+Serif:wght@500&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .err-page{
    min-height:100vh;display:grid;place-items:center;text-align:center;
    padding:64px 20px;
  }
  .err-pin{display:block;width:24px;height:32px;margin:0 auto 32px;color:var(--red)}
  .err-code{
    font-family:var(--mono);font-size:clamp(48px,12vw,88px);line-height:1;
    color:var(--text-3);margin:0 0 12px;font-variant-numeric:tabular-nums;
  }
  .err-title{font-size:clamp(22px,4vw,32px);color:var(--paper);margin:0 0 12px}
  .err-text{color:var(--text-2);max-width:46ch;margin:0 auto 32px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<main class="err-page">
  <div>
    <svg class="err-pin" viewBox="0 0 24 32" aria-hidden="true">
      <path d="M12 1C6.9 1 2.75 5.1 2.75 10.2 2.75 16.9 12 30 12 30s9.25-13.1 9.25-19.8C21.25 5.1 17.1 1 12 1z" fill="currentColor"/>
      <circle cx="12" cy="10.2" r="3.6" fill="var(--ink-1)"/>
    </svg>
    <p class="err-code">404</p>
    <h1 class="err-title">Χαθήκαμε στον χάρτη</h1>
    <p class="err-text">
      Η σελίδα που ψάχνεις δεν υπάρχει ή μετακινήθηκε σε άλλη γωνιά του πλανήτη.
      Γύρνα στην αρχική και συνέχισε από εκεί.
    </p>
    <a class="btn btn-primary" href="/">Επιστροφή στην αρχική</a>
  </div>
</main>
</body>
</html>
