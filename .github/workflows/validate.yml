name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Ensure no environment files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked. Remove it and rotate any exposed secrets."
            exit 1
          fi

      - name: Ensure no service-role key in client code
        run: |
          if grep -rInE 'service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY' js index.html admin.html netlify.toml; then
            echo "::error::A service-role key or reference was found in client code."
            exit 1
          fi
